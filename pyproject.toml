[project]
name = "temporalio-trio"
version = "0.1.0"
description = "Experimental Temporal Python SDK with Trio support"
authors = [{ name = "Maxim Fateev", email = "maxim@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["temporal", "workflow", "trio", "async"]
dependencies = [
    "trio>=0.27.0",
    "attrs>=23.2.0",
    "outcome>=1.3.0",
    "protobuf>=3.20,<7.0.0",
    "types-protobuf>=3.20",
    "typing-extensions>=4.2.0,<5",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Trio",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.48.2,<2"]
opentelemetry = ["opentelemetry-api>=1.11.1,<2", "opentelemetry-sdk>=1.11.1,<2"]

[project.urls]
Homepage = "https://github.com/mfateev/python-trio-sdk"
Repository = "https://github.com/mfateev/python-trio-sdk"
"Bug Tracker" = "https://github.com/mfateev/python-trio-sdk/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "mypy>=1.18.0",
    "pytest>=7.4",
    "pytest-trio>=0.8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5.0",
    "poethepoet>=0.25.0",
    "pytest-cov>=7.0.0",
]

[tool.poe.tasks]
format = [
    { cmd = "uv run ruff check --select I --fix" },
    { cmd = "uv run ruff format" },
]
lint = [
    { cmd = "uv run ruff check --select I" },
    { cmd = "uv run ruff format --check" },
    { ref = "lint-types" },
]
lint-types = [
    { cmd = "uv run pyright" },
    { cmd = "uv run mypy --namespace-packages ." },
]
test = "uv run pytest"

[tool.pytest.ini_options]
# Note: trio_mode=false allows sync tests to call trio.run() internally
# Async tests use @pytest.mark.trio explicitly
trio_mode = false
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
testpaths = ["tests"]
timeout = 60
timeout_func_only = true

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
include = ["temporalio_trio", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["temporalio_trio"]

[tool.uv]
package = false
