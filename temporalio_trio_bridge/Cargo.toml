[package]
name = "temporalio-trio-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "temporalio_trio_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1.26", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# Protobuf and gRPC
prost = "0.14"
tonic = "0.14"
url = "2.2"
anyhow = "1.0"

# SDK Core (path dependencies to submodule)
temporalio-sdk-core = { version = "0.1.0", path = "../sdk-core/crates/sdk-core" }
temporalio-common = { version = "0.1.0", path = "../sdk-core/crates/common" }
temporalio-client = { version = "0.1.0", path = "../sdk-core/crates/client" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
